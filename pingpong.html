<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="logo.png">
<title data-i18n="pp.doctitle">Ping Pong 2 Giocatori</title>
<script src="i18n.js"></script>
<style>
  :root {
    --bg: #e2d2f4;
    --panel: #ffffff;
    --text: #000000;
    --muted: #000000;
    --accent: #f7a3c7;
    --accent-2: #9fcaf2;
  }
  body { --glow: #ffc4de; }
  * { box-sizing: border-box; }
  button, input, select, kbd { font-family: inherit; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      linear-gradient(180deg, #1689F5 0%, #F58CA8 100%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 14px;
  }
  h1 { margin: 4px 0 0; font-size: 1.6rem; letter-spacing: 1px; color: #000000; }
  .back {
    align-self: flex-start;
    color: var(--muted);
    text-decoration: none;
    font-size: .9rem;
    font-weight: 600;
    padding: 6px 12px;
    border: 1px solid #bcd5f5;
    border-radius: 8px;
    background: var(--panel);
  }
  .back:hover { color: var(--text); border-color: var(--accent); }
  canvas {
    background: #000;
    border-radius: 10px;
    border: 2px solid #bcd5f5;
    width: 100%;
    max-width: 800px;
    height: auto;
    touch-action: none;
  }
  /* selettore dei colori: in alto il tema (‹ menu ›), sotto al massimo 6 colori alla volta */
  .palette {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 100%;
    max-width: 800px;
  }
  .theme-bar, .color-row { display: flex; align-items: center; gap: 8px; width: 100%; }
  .theme-bar { justify-content: center; }
  .arrow {
    flex: none; width: 36px; height: 36px;
    background: var(--panel); color: var(--text);
    border: 2px solid #bcd5f5; border-radius: 50%;
    font-size: 1.2rem; font-weight: 700; line-height: 1; cursor: pointer;
  }
  .arrow:hover { border-color: var(--accent); }
  .arrow.off { visibility: hidden; }
  .theme-select {
    min-width: 220px;
    background: linear-gradient(135deg, #bfe0ff, #ffc4de); color: var(--text);
    border: 2px solid var(--accent); border-radius: 999px;
    padding: 7px 16px; font-size: .95rem; font-weight: 700; text-align: center; cursor: pointer;
  }
  .colors[hidden], .color-btn[hidden] { display: none; }
  .colors {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 7px;
    background: #e6efff;
    border: 1px solid #bcd5f5;
    border-radius: 12px;
    padding: 10px 8px;
  }
  /* il nome della sezione è già nel menu del tema */
  .colors > span { display: none; }
  .colors .color-btn { padding: 7px 6px; font-size: .85rem; }
  @media (max-width: 640px) {
    .colors { grid-template-columns: repeat(3, 1fr); }
    .theme-select { min-width: 0; flex: 1; }
  }

  /* tutte le scritte lampeggiano piano, con una dissolvenza morbida */
  @keyframes slow-blink {
    0%, 100% {
      opacity: 1;
      text-shadow: 0 0 6px var(--glow, currentColor), 0 0 14px var(--glow, currentColor), 0 0 24px var(--glow, currentColor);
    }
    50% {
      opacity: .3;
      text-shadow: none;
    }
  }
  h1, .colors > span, .color-btn .lbl, .controls button {
    animation: slow-blink 2.4s ease-in-out infinite;
  }
  /* la luce del nome si irradia anche intorno al pulsante, allo stesso ritmo */
  @keyframes label-light {
    0%, 100% { box-shadow: 0 0 14px var(--glow), 0 0 28px var(--glow); }
    50%      { box-shadow: none; }
  }
  .color-btn { animation: label-light 2.4s ease-in-out infinite; }
  .color-btn {
    border: 2px solid transparent;
    border-radius: 999px;
    padding: 8px 14px;
    font-size: .9rem;
    font-weight: 600;
    cursor: pointer;
    color: #111;
    transition: transform .1s;
  }
  .color-btn:hover { transform: scale(1.06); }
  .color-btn.active { border-color: var(--text); box-shadow: 0 0 10px rgba(90,70,112,.45); }
  .rainbow-bg {
    background: linear-gradient(90deg, red, orange, yellow, lime, cyan, blue, violet);
  }
  .yinyang-bg {
    background: linear-gradient(90deg, #fff 50%, #111 50%);
    color: #888;
  }
  .galaxy-bg {
    background:
      radial-gradient(1px 1px at 20% 30%, #fff 99%, transparent),
      radial-gradient(1px 1px at 70% 60%, #fff 99%, transparent),
      radial-gradient(1.5px 1.5px at 45% 75%, #fff 99%, transparent),
      radial-gradient(1px 1px at 85% 25%, #fff 99%, transparent),
      radial-gradient(ellipse at 30% 40%, #c04bff 0%, transparent 60%),
      radial-gradient(ellipse at 75% 60%, #ff4fa3 0%, transparent 55%),
      linear-gradient(135deg, #0b0628, #2a0f6b 50%, #071a4a);
    color: #fff;
  }
  .candy-bg {
    background: repeating-linear-gradient(45deg, #ff3d7f 0 8px, #fff 8px 16px);
    color: #b0124f;
    text-shadow: 0 0 3px #fff, 0 0 3px #fff;
  }
  .lava-bg {
    background:
      radial-gradient(circle at 25% 60%, #ffe14b 0%, transparent 35%),
      radial-gradient(circle at 70% 35%, #ffb31a 0%, transparent 40%),
      linear-gradient(180deg, #ff6a00, #d61a00 60%, #4a0a00);
    color: #fff;
    text-shadow: 0 0 4px #000;
  }
  .water-bg {
    background:
      radial-gradient(ellipse 60% 30% at 30% 25%, rgba(255,255,255,.6), transparent),
      linear-gradient(180deg, #6fd6ff, #1a7fe0 60%, #0a3f8f);
    color: #fff;
    text-shadow: 0 0 3px #04306b;
  }
  .earth-bg {
    background:
      radial-gradient(circle at 20% 70%, #3b2210 0 2px, transparent 3px),
      radial-gradient(circle at 65% 55%, #3b2210 0 2px, transparent 3px),
      radial-gradient(circle at 85% 80%, #c9a26b 0 1.5px, transparent 2.5px),
      linear-gradient(180deg, #4caf3a 0 22%, #8a5a2b 22%, #5e3a1a);
    color: #fff;
    text-shadow: 0 0 3px #000;
  }
  .snow-bg {
    background:
      radial-gradient(circle at 20% 30%, #fff 0 2px, transparent 3px),
      radial-gradient(circle at 75% 25%, #fff 0 1.5px, transparent 2.5px),
      radial-gradient(circle at 55% 75%, #fff 0 2px, transparent 3px),
      linear-gradient(180deg, #e8f6ff, #a9d8f5);
    color: #2a6f9e;
  }
  .cursed-bg {
    background:
      linear-gradient(115deg, transparent 30%, #000 30% 34%, transparent 34% 52%, #000 52% 55%, transparent 55%),
      #e00000;
    color: #fff;
    text-shadow: 0 0 4px #000, 0 0 2px #000;
    animation: cursed-blink .5s steps(2, jump-none) infinite;
  }
  @keyframes cursed-blink {
    from { background-color: #ff1a1a; box-shadow: 0 0 12px #ff0000; }
    to   { background-color: #6a0000; box-shadow: none; }
  }
  .captain-bg {
    background:
      radial-gradient(circle at 50% 50%, #fff 0 5px, #1846c9 6px 11px, transparent 12px),
      repeating-linear-gradient(180deg, #c8102e 0 6px, #ffffff 6px 12px);
    color: #fff;
    text-shadow: 0 0 3px #001a66, 0 0 3px #001a66, 0 0 2px #000;
  }
  .thor-bg {
    background:
      linear-gradient(110deg, transparent 38%, #bfe8ff 39% 41%, transparent 42% 50%, #bfe8ff 51% 53%, transparent 54%),
      linear-gradient(180deg, #4a5568, #1e2a44);
    color: #e6f4ff;
    text-shadow: 0 0 4px #3aa0ff, 0 0 2px #000;
  }
  .hulk-bg {
    background: linear-gradient(180deg, #2b2b2b 0 18%, #5fd13a 18% 72%, #6a2c91 72%);
    color: #fff;
    text-shadow: 0 0 3px #0b3a05, 0 0 3px #0b3a05, 0 0 2px #000;
  }
  .spider-bg {
    background:
      repeating-conic-gradient(from 0deg at 50% 40%, #000 0 1.5deg, transparent 1.5deg 30deg),
      repeating-radial-gradient(circle at 50% 40%, transparent 0 7px, #000 7px 8px),
      linear-gradient(180deg, #d6001c 0 72%, #1846c9 72%);
    color: #fff;
    text-shadow: 0 0 3px #000, 0 0 3px #000;
  }
  .diamond-bg {
    background:
      linear-gradient(135deg, transparent 0 46%, rgba(255,255,255,.85) 48% 52%, transparent 54%),
      conic-gradient(from 20deg, #b9fbff, #4ff0ff, #e9feff, #2bc4e0, #b9fbff, #6ff6ff, #e9feff, #4ff0ff, #b9fbff);
    color: #06485a;
    text-shadow: 0 0 3px #fff, 0 0 3px #fff;
  }
  .amethyst-bg {
    background:
      linear-gradient(135deg, transparent 0 46%, rgba(245,225,255,.75) 48% 52%, transparent 54%),
      conic-gradient(from 20deg, #3c1a6b, #9b5de5, #e3c6ff, #7a3fc4, #3c1a6b, #b57bff, #e3c6ff, #9b5de5, #3c1a6b);
    color: #fff;
    text-shadow: 0 0 3px #22073f, 0 0 3px #22073f;
  }
  .netherite-bg {
    background:
      repeating-linear-gradient(90deg, transparent 0 9px, rgba(120, 90, 80, .45) 9px 11px),
      linear-gradient(135deg, transparent 0 40%, rgba(255,255,255,.18) 48% 52%, transparent 60%),
      linear-gradient(180deg, #5a5054, #2a2426);
    color: #f0e6ea;
    text-shadow: 0 0 3px #000, 0 0 3px #000;
  }
  .copper-bg {
    background:
      radial-gradient(circle at 18% 70%, #4fb8a0 0 4px, transparent 5px),
      radial-gradient(circle at 82% 30%, #4fb8a0 0 3px, transparent 4px),
      linear-gradient(135deg, transparent 0 40%, rgba(255,235,210,.55) 48% 52%, transparent 60%),
      linear-gradient(180deg, #f39a66, #c0592d);
    color: #fff;
    text-shadow: 0 0 3px #5a2208, 0 0 3px #5a2208;
  }
  .flag-btn {
    color: #fff;
    text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 2px #000;
  }
  .gold-bg {
    background:
      linear-gradient(135deg, transparent 0 40%, rgba(255,255,230,.85) 48% 52%, transparent 60%),
      linear-gradient(180deg, #ffe680, #d4a017 60%, #9c7410);
    color: #4a3300;
    text-shadow: 0 0 3px #fff6c0;
  }
  .emerald-bg {
    background:
      linear-gradient(135deg, transparent 0 46%, rgba(220,255,235,.7) 48% 52%, transparent 54%),
      conic-gradient(from 20deg, #0b6e3c, #11c26d, #50e3a4, #0f9d58, #0b6e3c, #2fd585, #50e3a4, #11c26d, #0b6e3c);
    color: #fff;
    text-shadow: 0 0 3px #00331a, 0 0 3px #00331a;
  }
  .sonic-bg {
    background:
      linear-gradient(100deg, transparent 0 30%, rgba(255,255,255,.55) 32% 35%, transparent 37% 55%, rgba(255,255,255,.35) 57% 59%, transparent 61%),
      linear-gradient(180deg, #4f8bff, #1f5fd6 60%, #0b2d7a);
    color: #fff;
    text-shadow: 0 0 3px #071a4a, 0 0 3px #071a4a;
  }
  .shadow-bg {
    background:
      linear-gradient(100deg, transparent 0 28%, #e63946 30% 36%, transparent 38% 60%, #e63946 62% 66%, transparent 68%),
      linear-gradient(180deg, #3a3a3a, #111 70%);
    color: #fff;
    text-shadow: 0 0 3px #000, 0 0 3px #000;
  }
  .summer-bg {
    background:
      radial-gradient(circle at 18% 45%, #fff3b0 0 5px, #ffd60a 6px 9px, transparent 10px),
      linear-gradient(180deg, #3fa7d6 0 55%, #ffd166 55%);
    color: #fff;
    text-shadow: 0 0 3px #7a3b00, 0 0 3px #7a3b00;
  }
  .winter-bg {
    background:
      radial-gradient(circle at 20% 30%, #fff 0 1.5px, transparent 2.5px),
      radial-gradient(circle at 70% 70%, #fff 0 1.5px, transparent 2.5px),
      radial-gradient(circle at 85% 25%, #fff 0 1px, transparent 2px),
      linear-gradient(180deg, #a8dadc, #457b9d 70%, #1d3557);
    color: #fff;
    text-shadow: 0 0 3px #0b2340, 0 0 3px #0b2340;
  }
  .autumn-bg {
    background:
      radial-gradient(ellipse 5px 3px at 18% 35%, #c1121f 98%, transparent),
      radial-gradient(ellipse 5px 3px at 80% 65%, #ffb703 98%, transparent),
      linear-gradient(135deg, #ffb703, #f77f00 50%, #9c2c00);
    color: #fff;
    text-shadow: 0 0 3px #4a1500, 0 0 3px #4a1500;
  }
  .spring-bg {
    background:
      radial-gradient(circle at 16% 40%, #ffd23a 0 1.5px, #ff8fc8 2.5px 4.5px, transparent 5.5px),
      radial-gradient(circle at 84% 60%, #ffd23a 0 1.5px, #ffffff 2.5px 4.5px, transparent 5.5px),
      linear-gradient(180deg, #a8e6a1, #7bc950 60%, #3a8a2a);
    color: #fff;
    text-shadow: 0 0 3px #1f4d12, 0 0 3px #1f4d12;
  }
  .ultra-bg {
    background: conic-gradient(#ff3b3b, #ff8c1a, #ffe14b, #2ee66b, #1de9c9, #3b7bff, #a24bff, #ff6fc8, #ff3b3b);
    color: #fff;
    text-shadow: 0 0 3px #000, 0 0 3px #000;
    animation: label-light 2.4s ease-in-out infinite, ultra-hue 4s steps(1) infinite;
  }
  @keyframes ultra-hue {
    0%   { filter: hue-rotate(0deg); }
    25%  { filter: hue-rotate(90deg); }
    50%  { filter: hue-rotate(180deg); }
    75%  { filter: hue-rotate(270deg); }
  }
  .ironman-bg {
    background:
      radial-gradient(circle at 50% 50%, #e9ffff 0 3px, #5ff3ff 4px, rgba(95,243,255,.4) 7px, transparent 9px),
      linear-gradient(90deg, #a30d12 0 22%, #f2c14e 22% 30%, #b3121a 30% 70%, #f2c14e 70% 78%, #a30d12 78%);
    color: #fff;
    text-shadow: 0 0 3px #000, 0 0 3px #000;
  }
  .cyborg-bg {
    background:
      linear-gradient(90deg, transparent 10%, #5ff3ff 10% 12%, transparent 12%),
      linear-gradient(0deg, transparent 70%, #5ff3ff 70% 74%, transparent 74%),
      linear-gradient(90deg, transparent 85%, #5ff3ff 85% 87%, transparent 87%),
      linear-gradient(160deg, #0a2a8f, #0b49d6 50%, #061a5c);
    color: #dffcff;
    text-shadow: 0 0 4px #00e5ff;
    animation: cyborg-blink 1s ease-in-out infinite;
  }
  @keyframes cyborg-blink {
    0%, 100% { box-shadow: 0 0 4px #00e5ff; }
    50%      { box-shadow: 0 0 16px #00e5ff, inset 0 0 8px #5ff3ff; }
  }
  .players {
    display: flex; justify-content: space-between; gap: 16px;
    width: 100%; max-width: 800px;
  }
  .player-box {
    flex: 1; max-width: 300px;
    display: flex; flex-direction: column; gap: 6px;
    background: var(--panel);
    border: 2px solid #bcd5f5;
    border-radius: 10px;
    padding: 10px 12px;
  }
  .player-box:last-child { text-align: right; }
  .player-box span {
    font-size: .8rem; font-weight: 600; color: var(--muted);
    animation: slow-blink 2.4s ease-in-out infinite;
  }
  .player-box input {
    background: #fffafc; color: var(--text);
    border: 1px solid #d9e9fb; border-radius: 6px;
    padding: 8px 10px; font-size: 1rem; font-weight: 700;
    width: 100%; box-sizing: border-box;
  }
  .player-box:last-child input { text-align: right; }
  .player-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .controls {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
  }
  .controls button {
    background: #ffffff; color: var(--text); border: 2px solid var(--accent); border-radius: 8px;
    padding: 10px 18px; font-size: 1rem; cursor: pointer;
  }
  kbd {
    background: var(--panel); border: 1px solid #d9e9fb; border-radius: 4px;
    padding: 1px 6px; font-size: .8rem; color: var(--text);
  }
</style>
</head>
<body>
  <a class="back" href="index.html" data-i18n="common.back">← Tutti i giochi</a>
  <h1>🏓 Ping Pong</h1>

  <div class="players">
    <label class="player-box">
      <span data-i18n="pp.selectName" data-i18n-n="1">Seleziona nome del giocatore 1</span>
      <input id="name1" type="text" maxlength="14" placeholder="Giocatore 1" data-i18n-placeholder="pp.player" data-i18n-n="1" autocomplete="off">
    </label>
    <label class="player-box">
      <span data-i18n="pp.selectName" data-i18n-n="2">Seleziona nome del giocatore 2</span>
      <input id="name2" type="text" maxlength="14" placeholder="Giocatore 2" data-i18n-placeholder="pp.player" data-i18n-n="2" autocomplete="off">
    </label>
  </div>

  <canvas id="game" width="800" height="480"></canvas>

  <div class="palette">
  <div class="colors" id="original-colors">
    <span data-i18n="sec.original">🎨 Colori originali</span>
  </div>

  <div class="colors special" id="colors">
    <span data-i18n="sec.original2">🎨 Colori originali 2</span>

  <div class="colors special" id="special-colors">

  </div>

  <div class="colors special" id="hero-colors">
    <span data-i18n="sec.hero">🦸 Hero Color</span>
  </div>

  <div class="colors special" id="mineral-colors">

  <div class="colors special" id="flag-colors">
    <span data-i18n="sec.flags">🚩 Flags Color</span>
  </div>

  <div class="colors special" id="season-colors">
    <span data-i18n="sec.seasons">🍂 Colori delle stagioni</span>
  </div>

  <div class="colors special" id="hedgehog-colors">
    <span data-i18n="sec.hedgehog">🦔 Hedgehog Colors</span>
  </div>

  <div class="colors special" id="ultra-colors">
    <span data-i18n="sec.ultra">💥 Ultra Color</span>
  </div>
  </div>

  <div class="controls">
    <button id="startBtn" data-i18n="pp.start">▶ Inizia / Pausa</button>
    <button id="resetBtn" data-i18n="pp.reset">↺ Ricomincia</button>
  </div>

  <!-- musica che suona durante la partita -->
  <audio id="music" src="music-play.m4a" loop preload="auto"></audio>

  // ---------- Bandiere ----------
  function stripesH(g, w, h, list) {
    const total = list.reduce((a, [, n]) => a + n, 0);
    let y = 0;
    list.forEach(([col, n]) => {
      const sh = h * n / total;
      g.fillStyle = col;
      g.fillRect(0, Math.floor(y), w, Math.ceil(sh) + 1);
      y += sh;
    });
  }
  function stripesV(g, w, h, cols) {
    cols.forEach((col, i) => {
      g.fillStyle = col;
      g.fillRect(Math.floor(i * w / cols.length), 0, Math.ceil(w / cols.length) + 1, h);
    });
  }

        const cw = w * 0.4, ch = h * 7 / 13;
        g.fillStyle = '#3C3B6E';
        g.fillRect(0, 0, cw, ch);
        g.fillStyle = '#ffffff';
        const rows = 5, cols = 6, rad = Math.max(0.6, Math.min(cw / cols, ch / rows) * 0.2);
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
          g.beginPath();
          g.arc((c + 0.5) * cw / cols, (r + 0.5) * ch / rows, rad, 0, Math.PI * 2);

  // selettore: un tema (sezione) alla volta, al massimo 6 colori per pagina

  const p1 = { x: 20, y: H / 2 - PADDLE_H / 2, score: 0 };
  const p2 = { x: W - 20 - PADDLE_W, y: H / 2 - PADDLE_H / 2, score: 0 };

  let running = false;
  let winner = null;
  let serveTimer = 0;
  let timeLeft = GAME_TIME;
  let lastTime = null;
  const keys = {};

  function formatTime() {
    const s = Math.ceil(timeLeft);
    const mm = String(Math.floor(s / 60)).padStart(2, '0');
    const ss = String(s % 60).padStart(2, '0');

  // nomi dei giocatori (se il riquadro è vuoto si usa "Giocatore 1" / "Giocatore 2")

  nameInputs.forEach((input, i) => {

    input.addEventListener('input', () => {

    });

  function playerName(n) {
    return nameInputs[n - 1].value.trim() || I18N.t('pp.player', { n });

  function timeUp() {
    if (p1.score > p2.score) winner = playerName(1);
    else if (p2.score > p1.score) winner = playerName(2);
    else winner = 'pareggio';
    running = false;
    syncMusic();

  function resetBall(direction) {
    ball.x = W / 2;
    ball.y = H / 2;
    const angle = (Math.random() * 0.6 - 0.3) * Math.PI / 2;
    ball.vx = Math.cos(angle) * BALL_SPEED * direction;
    ball.vy = Math.sin(angle) * BALL_SPEED;
    superFast = false;
    trail.length = 0;
    serveTimer = 45; // breve pausa prima del servizio
  }

  function resetGame() {
    p1.score = p2.score = 0;
    p1.y = p2.y = H / 2 - PADDLE_H / 2;
    winner = null;
    timeLeft = GAME_TIME;
    confetti.length = 0;
    winStartedAt = null;
    winBolts = [];
    resetBall(Math.random() < 0.5 ? 1 : -1);
  }

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  function hitPaddle(p) {
    return ball.x - BALL_R < p.x + PADDLE_W &&
           ball.x + BALL_R > p.x &&
           ball.y + BALL_R > p.y &&
           ball.y - BALL_R < p.y + PADDLE_H;
  }

  function bounceOff(p, dir) {
    // l'angolo dipende da dove la pallina colpisce la racchetta
    const rel = (ball.y - (p.y + PADDLE_H / 2)) / (PADDLE_H / 2);
    const angle = rel * Math.PI / 3.2;
    // di solito la pallina torna a velocità normale, ma ogni tanto parte un tiro super veloce
    superFast = Math.random() < SUPER_CHANCE;
    if (superFast) superMsgUntil = performance.now() + 900;
    const speed = superFast ? BALL_SUPER_SPEED : BALL_SPEED;
    ball.vx = Math.cos(angle) * speed * dir;
    ball.vy = Math.sin(angle) * speed;
    ball.x = dir > 0 ? p.x + PADDLE_W + BALL_R : p.x - BALL_R;
  }

  // k = quanti fotogrammi "da 60 al secondo" sono passati: così la velocità è sempre la stessa,
  // anche se il computer disegna meno fotogrammi (o di più, sugli schermi a 120 Hz)
  function update(k) {
    if (keys['w']) p1.y -= PADDLE_SPEED * k;
    if (keys['s']) p1.y += PADDLE_SPEED * k;
    if (keys['arrowup']) p2.y -= PADDLE_SPEED * k;
    if (keys['arrowdown']) p2.y += PADDLE_SPEED * k;
    p1.y = clamp(p1.y, 0, H - PADDLE_H);
    p2.y = clamp(p2.y, 0, H - PADDLE_H);

    if (serveTimer > 0) { serveTimer -= k; return; }

    ball.x += ball.vx * k;
    ball.y += ball.vy * k;

    if (ball.y - BALL_R < 0)  { ball.y = BALL_R; ball.vy *= -1; }
    if (ball.y + BALL_R > H)  { ball.y = H - BALL_R; ball.vy *= -1; }

    if (ball.vx < 0 && hitPaddle(p1)) bounceOff(p1, 1);
    if (ball.vx > 0 && hitPaddle(p2)) bounceOff(p2, -1);

    if (ball.x < -BALL_R) { p2.score++; scored(-1); }
    else if (ball.x > W + BALL_R) { p1.score++; scored(1); }

    trail.push({ x: ball.x, y: ball.y, hue });
    if (trail.length > (superFast ? 30 : 14)) trail.shift();
  }

  function scored(direction) {
    if (p1.score >= WIN_SCORE) winner = playerName(1);
    else if (p2.score >= WIN_SCORE) winner = playerName(2);
    if (winner) { running = false; syncMusic(); }
    resetBall(direction);
  }

  function currentColor(h) {
    if (ballColor === 'rainbow') return `hsl(${h % 360}, 100%, 55%)`;
    if (ballColor === 'yinyang') return '#cfcfcf';
    if (ballColor === 'galaxy') return `hsl(${270 + Math.sin(h / 30) * 50}, 90%, 62%)`;
    if (ballColor === 'cursed') return cursedOn() ? '#ff1a1a' : '#5a0000';
    if (ballColor === 'cyborg') return cyborgOn() ? '#5ff3ff' : '#1e5bff';
    if (ballColor === 'diamond') return Math.floor(h / 20) % 3 ? '#4ff0ff' : '#e9feff';
    if (ballColor === 'sonic') return Math.floor(h / 16) % 2 ? '#4f8bff' : '#1f5fd6';
    if (ballColor === 'shadow') return Math.floor(h / 16) % 2 ? '#e63946' : '#2a2a2a';
    if (ballColor === 'summer') return Math.floor(h / 20) % 2 ? '#ffd60a' : '#ff9e00';
    if (ballColor === 'winter') return Math.floor(h / 20) % 2 ? '#bfe8ff' : '#ffffff';
    if (ballColor === 'autumn') return ['#f77f00', '#c1121f', '#ffb703'][Math.floor(h / 20) % 3];
    if (ballColor === 'spring') return Math.floor(h / 20) % 2 ? '#ff8fc8' : '#7bc950';
    if (flagId(ballColor)) {
      const f = FLAGS[flagId(ballColor)];
      return f.colors[Math.floor(h / 20) % f.colors.length];
    }
    if (ballColor === 'amethyst') return Math.floor(h / 20) % 3 ? '#9b5de5' : '#e3c6ff';
    if (ballColor === 'netherite') return Math.floor(h / 20) % 3 ? '#4a4245' : '#8a7a80';
    if (ballColor === 'copper') return Math.floor(h / 20) % 4 ? '#e07b4a' : '#4fb8a0';
    if (ballColor === 'gold') return Math.floor(h / 20) % 3 ? '#ffd84a' : '#fff3b0';
    if (ballColor === 'emerald') return Math.floor(h / 20) % 3 ? '#11c26d' : '#7dffc0';
    if (ballColor === 'captain') return ['#c8102e', '#ffffff', '#1846c9'][Math.floor(h / 20) % 3];
    if (ballColor === 'thor') return Math.random() < 0.3 ? '#ffffff' : '#7ec8ff';
    if (ballColor === 'hulk') return Math.floor(h / 30) % 3 ? '#5fd13a' : '#6a2c91';
    if (ballColor === 'ironman') return Math.floor(h / 24) % 2 ? '#f2c14e' : '#c8102e';
    if (ballColor === 'spiderman') return Math.floor(h / 24) % 2 ? '#1846c9' : '#e0001f';
    if (ballColor === 'candy') return Math.floor(h / 20) % 2 ? '#ff3d7f' : '#ffffff';
    if (ballColor === 'lava') return `hsl(${15 + Math.random() * 25}, 100%, 52%)`;
    if (ballColor === 'water') return `hsl(${200 + Math.sin(h / 20) * 10}, 95%, 60%)`;
    if (ballColor === 'earth') return Math.floor(h / 30) % 3 ? '#8a5a2b' : '#4caf3a';
    if (ballColor === 'snow') return '#eaf7ff';
    return ballColor;
  }

  // pallina acqua: sfera blu con un'onda che scorre e un riflesso
  function drawWater(x, y, r, t) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = '#9be6ff';
    ctx.fillRect(-r, -r, r * 2, r * 2);
    const g = ctx.createLinearGradient(0, -r, 0, r);
    g.addColorStop(0, '#2ba8ff');
    g.addColorStop(1, '#0a3f8f');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-r, r);
    for (let px = -r; px <= r; px += 1) {
      ctx.lineTo(px, -r * 0.15 + Math.sin(px / r * 4 + t / 120) * r * 0.2);
    }
    ctx.lineTo(r, r);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath();
    ctx.ellipse(-r * 0.35, -r * 0.45, r * 0.3, r * 0.15, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // pallina terra: zolla marrone con sassolini e un ciuffo d'erba che ruota
  const EARTH_PEBBLES = Array.from({ length: 6 }, () => ({
    a: Math.random() * Math.PI * 2,
    d: Math.random() * 0.75,
    s: 0.1 + Math.random() * 0.12,
    light: Math.random() < 0.5,
  }));

  function drawEarth(x, y, r, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
    const g = ctx.createRadialGradient(-r / 3, -r / 3, 0, 0, 0, r);
    g.addColorStop(0, '#a87440');
    g.addColorStop(1, '#5e3a1a');
    ctx.fillStyle = g;
    ctx.fillRect(-r, -r, r * 2, r * 2);
    EARTH_PEBBLES.forEach(p => {
      ctx.fillStyle = p.light ? '#c9a26b' : '#3b2210';
      ctx.beginPath();
      ctx.arc(Math.cos(p.a) * p.d * r, Math.sin(p.a) * p.d * r, p.s * r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.fillStyle = '#4caf3a';
    ctx.fillRect(-r, -r, r * 2, r * 0.45);
    ctx.restore();
  }

  // pallina neve: palla bianca con un fiocco di neve che gira
  function drawSnow(x, y, r, angle) {
    ctx.save();
    ctx.translate(x, y);
    const g = ctx.createRadialGradient(-r / 3, -r / 3, 0, 0, 0, r);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(1, '#a9d8f5');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.rotate(angle);
    ctx.strokeStyle = '#3a8fd0';
    ctx.lineWidth = 1.2;
    ctx.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
      ctx.rotate(Math.PI / 3);
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(0, -r * 0.75);
      ctx.moveTo(0, -r * 0.45); ctx.lineTo(-r * 0.18, -r * 0.62);
      ctx.moveTo(0, -r * 0.45); ctx.lineTo(r * 0.18, -r * 0.62);
      ctx.stroke();
    }
    ctx.restore();
  }

  // le scritte lampeggiano piano (ciclo di 2,4 s, come le scritte della pagina):
  // quando sono accese fanno una luce del loro colore, poi sfumano e si spengono
  const BLINK_PERIOD = 2400;
  function blinkPhase() {
    return 0.5 + 0.5 * Math.cos(performance.now() / BLINK_PERIOD * Math.PI * 2);
  }

  function textGlow(color) {
    const level = blinkPhase();
    ctx.globalAlpha = 0.3 + 0.7 * level;
    ctx.shadowColor = color;
    ctx.shadowBlur = 24 * level;
  }

  function textGlowOff() {
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  // colore maledetto: rosso che lampeggia, con fulmini neri
  function cursedOn() {
    return Math.floor(performance.now() / 120) % 2 === 0;
  }

  let cursedBolts = [];

  // crea un fulmine a zig-zag da (x1, y1) verso (x2, y2), con qualche ramo
  function makeBolt(x1, y1, x2, y2, life) {
    const pts = [{ x: x1, y: y1 }];
    const steps = 6 + Math.floor(Math.random() * 4);
    const len = Math.hypot(x2 - x1, y2 - y1);
    const nx = -(y2 - y1) / len, ny = (x2 - x1) / len;
    for (let i = 1; i < steps; i++) {
      const f = i / steps;
      const off = (Math.random() - 0.5) * len * 0.25;
      pts.push({ x: x1 + (x2 - x1) * f + nx * off, y: y1 + (y2 - y1) * f + ny * off });
    }
    pts.push({ x: x2, y: y2 });
    const branches = [];
    if (len > 40) {
      const from = pts[2 + Math.floor(Math.random() * (pts.length - 3))];
      const a = Math.atan2(y2 - y1, x2 - x1) + (Math.random() < 0.5 ? -0.8 : 0.8);
      const bl = len * 0.35;
      branches.push([from, { x: from.x + Math.cos(a) * bl, y: from.y + Math.sin(a) * bl }]);
    }
    return { pts, branches, life, width: len > 100 ? 4 : 2.5 };
  }

  function drawBolts(bolts) {
    ctx.save();
    ctx.lineJoin = 'miter';
    ctx.lineCap = 'round';
    bolts.forEach(b => {
      ctx.shadowColor = b.glow || '#ff0000';
      ctx.shadowBlur = 12;
      ctx.strokeStyle = b.color || '#000';
      ctx.lineWidth = b.width;
      ctx.beginPath();
      b.pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
      b.branches.forEach(([p, q]) => { ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); });
      ctx.stroke();
      b.life--;
    });
    ctx.restore();
    return bolts.filter(b => b.life > 0);
  }

  function drawCursed(x, y, r) {
    // ogni tanto nuovi fulmini partono dalla pallina in direzioni casuali
    if (Math.random() < 0.18) {
      const a = Math.random() * Math.PI * 2;
      const l = 30 + Math.random() * 45;
      cursedBolts.push(makeBolt(x, y, x + Math.cos(a) * l, y + Math.sin(a) * l, 5));
    }
    cursedBolts = drawBolts(cursedBolts);

    ctx.save();
    ctx.translate(x, y);
    const on = cursedOn();
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = on ? 28 : 6;
    const g = ctx.createRadialGradient(-r / 3, -r / 3, 0, 0, 0, r);
    g.addColorStop(0, on ? '#ff6a6a' : '#a00000');
    g.addColorStop(1, on ? '#c00000' : '#300000');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    // crepa nera sulla pallina
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-r * 0.2, -r * 0.9);
    ctx.lineTo(r * 0.15, -r * 0.2);
    ctx.lineTo(-r * 0.15, r * 0.1);
    ctx.lineTo(r * 0.2, r * 0.9);
    ctx.stroke();
    ctx.restore();
  }

  // colore cyborg: sfera metallica blu con circuiti azzurri e un occhio che lampeggia
  function cyborgOn() {
    return Math.floor(performance.now() / 300) % 2 === 0;
  }

  function drawCyborg(x, y, r, t) {
    const on = cyborgOn();
    ctx.save();
    ctx.translate(x, y);
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = on ? 24 : 8;
    const g = ctx.createRadialGradient(-r / 3, -r / 3, 0, 0, 0, r);
    g.addColorStop(0, '#4f8dff');
    g.addColorStop(0.6, '#0b3bc0');
    g.addColorStop(1, '#04164f');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
    ctx.rotate(t / 600);
    // linee dei circuiti
    ctx.strokeStyle = on ? '#5ff3ff' : '#2aa8c8';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-r, -r * 0.3); ctx.lineTo(-r * 0.4, -r * 0.3); ctx.lineTo(-r * 0.2, -r * 0.6);
    ctx.moveTo(r, r * 0.35); ctx.lineTo(r * 0.45, r * 0.35); ctx.lineTo(r * 0.25, r * 0.65);
    ctx.moveTo(-r * 0.3, r); ctx.lineTo(-r * 0.3, r * 0.5);
    ctx.stroke();
    ctx.fillStyle = ctx.strokeStyle;
    [[-r * 0.2, -r * 0.6], [r * 0.25, r * 0.65], [-r * 0.3, r * 0.5]].forEach(([px, py]) => {
      ctx.beginPath(); ctx.arc(px, py, 1.2, 0, Math.PI * 2); ctx.fill();
    });
    // anello e occhio centrale che lampeggia
    ctx.strokeStyle = '#5ff3ff';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.38, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = on ? '#e6fdff' : '#0a6f8a';
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = on ? 10 : 0;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // ragnatela: raggi dal centro e anelli a zig-zag
  function drawWeb(c, cx, cy, radius, rings, spokes) {
    c.beginPath();
    for (let i = 0; i < spokes; i++) {
      const a = (i / spokes) * Math.PI * 2;
      c.moveTo(cx, cy);
      c.lineTo(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius);
    }
    for (let k = 1; k <= rings; k++) {
      const rr = (k / rings) * radius;
      for (let i = 0; i < spokes; i++) {
        const a1 = (i / spokes) * Math.PI * 2;
        const a2 = ((i + 1) / spokes) * Math.PI * 2;
        const am = (a1 + a2) / 2;
        const x1 = cx + Math.cos(a1) * rr, y1 = cy + Math.sin(a1) * rr;
        const x2 = cx + Math.cos(a2) * rr, y2 = cy + Math.sin(a2) * rr;
        // i fili tra un raggio e l'altro curvano verso il centro
        const qx = cx + Math.cos(am) * rr * 0.8, qy = cy + Math.sin(am) * rr * 0.8;
        if (i === 0) c.moveTo(x1, y1);
        c.quadraticCurveTo(qx, qy, x2, y2);
      }
    }
    c.stroke();
  }

  // pallina spider man: maschera rossa con ragnatela, occhi bianchi e parte bassa blu
  function drawSpider(x, y, r) {
    ctx.save();
    ctx.translate(x, y);
    ctx.shadowColor = '#ff2020';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#d6001c';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = '#1846c9';
    ctx.fillRect(-r, r * 0.55, r * 2, r);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 0.7;
    drawWeb(ctx, 0, -r * 0.1, r * 1.1, 3, 8);
    // occhi
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.3;
    [-1, 1].forEach(s => {
      ctx.beginPath();
      ctx.moveTo(s * r * 0.12, -r * 0.05);
      ctx.quadraticCurveTo(s * r * 0.75, -r * 0.65, s * r * 0.7, -r * 0.05);
      ctx.quadraticCurveTo(s * r * 0.45, r * 0.15, s * r * 0.12, -r * 0.05);
      ctx.fill();
      ctx.stroke();
    });
    ctx.restore();
  }

  // pallina gemma (diamante / smeraldo): sfaccettature, tavola centrale e un luccichio che brilla
  const GEMS = {
    diamond: { light: '#e9feff', mid: '#4ff0ff', dark: '#1a8fb0', facet: 'rgba(255,255,255,0.85)', glow: '#9ff8ff' },
    emerald: { light: '#9dffd0', mid: '#11c26d', dark: '#064d29', facet: 'rgba(200,255,225,0.7)', glow: '#50e3a4' },
    amethyst: { light: '#f0dcff', mid: '#9b5de5', dark: '#3c1a6b', facet: 'rgba(245,225,255,0.75)', glow: '#b57bff' },
  };

  // ---------- Stagioni ----------
  // particelle che escono dalla pallina: scintille (estate), neve (inverno), foglie (autunno), petali (primavera)
  let seasonParticles = [];
  const PARTICLE_COLORS = {
    spark: ['#fff3b0', '#ffd60a', '#ffb703'],
    snow: ['#ffffff', '#e6f6ff'],
    leaf: ['#f77f00', '#c1121f', '#ffb703', '#9c2c00'],
    petal: ['#ff8fc8', '#ffc2e0', '#ffffff'],
    ring: ['#ffd23a', '#ffe680'],
    chaos: ['#ff3b3b', '#ff8a8a', '#ffd0d0'],
  };

  function spawnSeasonParticle(x, y, r, kind) {
    const cols = PARTICLE_COLORS[kind];
    seasonParticles.push({
      x: x + (Math.random() - 0.5) * r * 2,
      y: y + (Math.random() - 0.5) * r * 2,
      vx: (Math.random() - 0.5) * 0.8,
      vy: kind === 'spark' || kind === 'chaos' ? -0.4 - Math.random() * 0.6 : 0.4 + Math.random() * 0.7,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.2,
      life: 0,
      max: 50 + Math.random() * 40,
      kind,
      color: cols[Math.floor(Math.random() * cols.length)],
      size: kind === 'snow' ? 1.5 + Math.random() * 1.5 : 2 + Math.random() * 2,
    });
  }

  function drawSeasonParticles() {
    if (!seasonParticles.length) return;
    ctx.save();
    seasonParticles.forEach(p => {
      p.life++;
      p.x += p.vx + (p.kind === 'spark' || p.kind === 'chaos' || p.kind === 'ring' ? 0 : Math.sin(p.life / 8 + p.rot) * 0.4);
      p.y += p.vy;
      p.rot += p.vr;
      ctx.globalAlpha = Math.max(0, 1 - p.life / p.max);
      ctx.fillStyle = p.color;
      if (p.kind === 'ring') {
        // anello d'oro che ruota (si vede più stretto quando è di taglio)
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, Math.max(0.6, Math.abs(Math.cos(p.rot * 2)) * 3.5), 3.5, 0, 0, Math.PI * 2);
        ctx.stroke();
      } else if (p.kind === 'snow' || p.kind === 'spark' || p.kind === 'chaos') {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.beginPath(); ctx.ellipse(0, 0, p.size * 1.6, p.size * 0.8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    });
    ctx.restore();
    seasonParticles = seasonParticles.filter(p => p.life < p.max);
  }

  function seasonBase(x, y, r, glow, stops) {
    ctx.translate(x, y);
    ctx.shadowColor = glow;
    ctx.shadowBlur = 16;
    const g = ctx.createRadialGradient(-r / 3, -r / 3, 0, 0, 0, r);
    stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // estate: un sole con i raggi che girano e scintille che salgono
  function drawSummer(x, y, r, t) {
    if (Math.random() < 0.3) spawnSeasonParticle(x, y, r, 'spark');
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(t / 700);
    ctx.fillStyle = '#ffb703';
    ctx.shadowColor = '#ffb703';
    ctx.shadowBlur = 12;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a - 0.22) * r * 0.9, Math.sin(a - 0.22) * r * 0.9);
      ctx.lineTo(Math.cos(a) * r * 1.45, Math.sin(a) * r * 1.45);
      ctx.lineTo(Math.cos(a + 0.22) * r * 0.9, Math.sin(a + 0.22) * r * 0.9);
      ctx.fill();
    }
    ctx.restore();
    ctx.save();
    seasonBase(x, y, r * 0.95, '#ffb703', ['#fff3b0', '#ffd60a', '#ff9e00']);
    ctx.restore();
  }

  // inverno: sfera di ghiaccio con un cristallo bianco e neve che cade
  function drawWinter(x, y, r, t) {
    if (Math.random() < 0.3) spawnSeasonParticle(x, y, r, 'snow');
    ctx.save();
    seasonBase(x, y, r, '#bfe8ff', ['#ffffff', '#bfe8ff', '#4a90d9']);
    ctx.rotate(t / 1500);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * r * 0.8, Math.sin(a) * r * 0.8);
      const mx = Math.cos(a) * r * 0.5, my = Math.sin(a) * r * 0.5;
      ctx.moveTo(mx, my); ctx.lineTo(mx + Math.cos(a + 0.7) * r * 0.25, my + Math.sin(a + 0.7) * r * 0.25);
      ctx.moveTo(mx, my); ctx.lineTo(mx + Math.cos(a - 0.7) * r * 0.25, my + Math.sin(a - 0.7) * r * 0.25);
    }
    ctx.stroke();
    ctx.restore();
  }

  // autunno: pallina arancione con una foglia che ondeggia e foglie che cadono
  function drawAutumn(x, y, r, t) {
    if (Math.random() < 0.25) spawnSeasonParticle(x, y, r, 'leaf');
    ctx.save();
    seasonBase(x, y, r, '#f77f00', ['#ffd166', '#f77f00', '#9c2c00']);
    ctx.rotate(Math.sin(t / 400) * 0.5);
    ctx.fillStyle = '#b5301a';
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.7);
    ctx.quadraticCurveTo(r * 0.6, -r * 0.2, 0, r * 0.45);
    ctx.quadraticCurveTo(-r * 0.6, -r * 0.2, 0, -r * 0.7);
    ctx.fill();
    ctx.strokeStyle = '#6b1a0c';
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(0, -r * 0.55); ctx.lineTo(0, r * 0.75); ctx.stroke();
    ctx.restore();
  }

  // primavera: pallina verde con un fiore rosa che gira e petali che volano
  function drawSpring(x, y, r, t) {
    if (Math.random() < 0.25) spawnSeasonParticle(x, y, r, 'petal');
    ctx.save();
    seasonBase(x, y, r, '#ff8fc8', ['#d8f5c0', '#7bc950', '#3a8a2a']);
    ctx.rotate(t / 900);
    ctx.fillStyle = '#ff8fc8';
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      ctx.beginPath();
      ctx.ellipse(Math.cos(a) * r * 0.38, Math.sin(a) * r * 0.38, r * 0.3, r * 0.18, a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#ffd23a';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // ---------- Ricci (Sonic e Shadow) ----------
  // la pallina è uno "spin dash": una palla di aculei che gira velocissima
  const HEDGEHOG_STYLE = {
    sonic:  { body: '#1f5fd6', light: '#6fa8ff', swirl: 'rgba(255,255,255,0.85)', glow: '#4f8bff', particle: 'ring', chance: 0.07 },
    shadow: { body: '#151515', light: '#4a4a4a', swirl: '#e63946', glow: '#ff3b3b', particle: 'chaos', chance: 0.3 },
  };

  function drawHedgehog(x, y, r, t, kind) {
    const c = HEDGEHOG_STYLE[kind];
    if (Math.random() < c.chance) spawnSeasonParticle(x, y, r, c.particle);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(t / 45);
    ctx.shadowColor = c.glow;
    ctx.shadowBlur = 16;
    // sagoma con gli aculei
    ctx.fillStyle = c.body;
    ctx.beginPath();
    const spikes = 9;
    for (let i = 0; i < spikes * 2; i++) {
      const a = (i / (spikes * 2)) * Math.PI * 2;
      const d = i % 2 ? r * 0.82 : r * 1.18;
      if (i === 0) ctx.moveTo(Math.cos(a) * d, Math.sin(a) * d); else ctx.lineTo(Math.cos(a) * d, Math.sin(a) * d);
    }
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    // interno più chiaro
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, 0, 0, 0, r * 0.85);
    g.addColorStop(0, c.light);
    g.addColorStop(1, c.body);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.82, 0, Math.PI * 2); ctx.fill();
    // strisce a spirale della rotazione
    ctx.strokeStyle = c.swirl;
    ctx.lineWidth = 1.4;
    ctx.lineCap = 'round';
    [[0.3, 0], [0.55, 2.1], [0.75, 4.2]].forEach(([rad, start]) => {
      ctx.beginPath();
      ctx.arc(0, 0, r * rad, start, start + 1.6);
      ctx.stroke();
    });
    ctx.restore();
  }

  // pallina bandiera: la bandiera dentro la pallina, che ondeggia piano, con un riflesso lucido
  function drawFlagBall(x, y, r, t, id) {
    const f = FLAGS[id];
    ctx.save();
    ctx.translate(x, y);
    ctx.shadowColor = f.glow;
    ctx.shadowBlur = 14;
    ctx.fillStyle = f.colors[0];
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.clip();
    const w = r * 2.7, h = r * 2.1;
    const sway = Math.sin(t / 350) * r * 0.25;
    ctx.drawImage(flagTex(id, 54, 36), -w / 2 + sway, -h / 2, w, h);
    const shine = ctx.createRadialGradient(-r * 0.4, -r * 0.45, 0, -r * 0.4, -r * 0.45, r);
    shine.addColorStop(0, 'rgba(255,255,255,0.55)');
    shine.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = shine;
    ctx.fillRect(-r, -r, r * 2, r * 2);
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, r - 0.5, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // metalli (netherite, rame, oro): sfera lucida con un riflesso che scorre
  const METALS = {
    netherite: { light: '#8a7a80', mid: '#4a4245', dark: '#1c1719', glow: '#8a7a80' },
    copper:    { light: '#ffc49a', mid: '#e07b4a', dark: '#7a3014', glow: '#ff9a5a' },
    gold:      { light: '#fff3b0', mid: '#ffd84a', dark: '#9c7410', glow: '#ffd84a' },
  };

  function drawMetal(x, y, r, t, metal) {
    const c = METALS[metal];
    ctx.save();
    ctx.translate(x, y);
    ctx.shadowColor = c.glow;
    ctx.shadowBlur = 14;
    const g = ctx.createRadialGradient(-r / 3, -r / 3, 0, 0, 0, r);
    g.addColorStop(0, c.light);
    g.addColorStop(0.55, c.mid);
    g.addColorStop(1, c.dark);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();

    if (metal === 'netherite') {
      // venature scure e rossicce, come il lingotto di netherite
      ctx.strokeStyle = 'rgba(120, 80, 70, 0.7)';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      for (let i = -2; i <= 2; i++) { ctx.moveTo(i * r * 0.4, -r); ctx.lineTo(i * r * 0.4 + r * 0.2, r); }
      ctx.stroke();
    } else if (metal === 'copper') {
      // macchie verde acqua di ossidazione
      ctx.fillStyle = 'rgba(79, 184, 160, 0.85)';
      [[-0.45, 0.4, 0.22], [0.5, -0.2, 0.16], [0.15, 0.6, 0.12]].forEach(([a, b, s]) => {
        ctx.beginPath(); ctx.arc(a * r, b * r, s * r, 0, Math.PI * 2); ctx.fill();
      });
    }

    // riflesso diagonale che attraversa la sfera
    const pos = ((t / 900) % 2) * 2.4 - 1.2;
    ctx.rotate(-Math.PI / 4);
    ctx.fillStyle = metal === 'netherite' ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.7)';
    ctx.fillRect(pos * r - r * 0.15, -r * 1.5, r * 0.3, r * 3);
    ctx.restore();
  }

  function drawGem(x, y, r, t, gem) {
    const c = GEMS[gem];
    ctx.save();
    ctx.translate(x, y);
    ctx.shadowColor = c.glow;
    ctx.shadowBlur = 16;
    const g = ctx.createRadialGradient(-r / 3, -r / 3, 0, 0, 0, r);
    g.addColorStop(0, c.light);
    g.addColorStop(0.55, c.mid);
    g.addColorStop(1, c.dark);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

    // sfaccettature: un ottagono al centro collegato al bordo
    ctx.rotate(t / 2500);
    ctx.strokeStyle = c.facet;
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const ix = Math.cos(a) * r * 0.48, iy = Math.sin(a) * r * 0.48;
      if (i === 0) ctx.moveTo(ix, iy); else ctx.lineTo(ix, iy);
    }
    ctx.closePath();
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      ctx.moveTo(Math.cos(a) * r * 0.48, Math.sin(a) * r * 0.48);
      ctx.lineTo(Math.cos(a + Math.PI / 8) * r, Math.sin(a + Math.PI / 8) * r);
    }
    ctx.stroke();
    ctx.rotate(-t / 2500);

    // luccichio a stella che si accende e si spegne
    const s = Math.max(0, Math.sin(t / 260));
    if (s > 0.05) {
      ctx.fillStyle = `rgba(255, 255, 255, ${s})`;
      const sx = -r * 0.35, sy = -r * 0.4, l = r * 0.75 * s;
      ctx.beginPath();
      ctx.moveTo(sx, sy - l); ctx.lineTo(sx + l * 0.2, sy - l * 0.2); ctx.lineTo(sx + l, sy);
      ctx.lineTo(sx + l * 0.2, sy + l * 0.2); ctx.lineTo(sx, sy + l); ctx.lineTo(sx - l * 0.2, sy + l * 0.2);
      ctx.lineTo(sx - l, sy); ctx.lineTo(sx - l * 0.2, sy - l * 0.2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // pallina iron man: elmo rosso metallico con la maschera dorata e gli occhi luminosi
  function drawIronMan(x, y, r, t) {
    ctx.save();
    ctx.translate(x, y);
    ctx.shadowColor = '#ffb020';
    ctx.shadowBlur = 14;
    const g = ctx.createRadialGradient(-r / 3, -r / 3, 0, 0, 0, r);
    g.addColorStop(0, '#ff4a4a');
    g.addColorStop(0.6, '#b3121a');
    g.addColorStop(1, '#5a0408');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();

    // maschera dorata
    const gold = ctx.createLinearGradient(0, -r, 0, r);
    gold.addColorStop(0, '#fff1b0');
    gold.addColorStop(0.5, '#f2c14e');
    gold.addColorStop(1, '#a8761a');
    ctx.fillStyle = gold;
    ctx.beginPath();
    ctx.moveTo(-r * 0.62, -r * 0.5);
    ctx.lineTo(r * 0.62, -r * 0.5);
    ctx.lineTo(r * 0.55, r * 0.35);
    ctx.lineTo(r * 0.3, r * 1.0);
    ctx.lineTo(-r * 0.3, r * 1.0);
    ctx.lineTo(-r * 0.55, r * 0.35);
    ctx.closePath();
    ctx.fill();
    // linea della bocca
    ctx.strokeStyle = '#7a5210';
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(-r * 0.3, r * 0.5); ctx.lineTo(r * 0.3, r * 0.5); ctx.stroke();

    // occhi luminosi che pulsano
    const glow = 0.7 + 0.3 * Math.sin(t / 180);
    ctx.fillStyle = `rgba(220, 255, 255, ${glow})`;
    ctx.shadowColor = '#5ff3ff';
    ctx.shadowBlur = 8;
    [-1, 1].forEach(s => {
      ctx.beginPath();
      ctx.moveTo(s * r * 0.12, -r * 0.12);
      ctx.lineTo(s * r * 0.5, -r * 0.2);
      ctx.lineTo(s * r * 0.48, -r * 0.05);
      ctx.lineTo(s * r * 0.15, 0);
      ctx.closePath();
      ctx.fill();
    });
    ctx.restore();
  }

  // pallina captain america: lo scudo con gli anelli rosso-bianco e la stella bianca su fondo blu
  function drawCaptain(x, y, r, t) {
    ctx.save();
    ctx.translate(x, y);
    ctx.shadowColor = '#3b6bff';
    ctx.shadowBlur = 14;
    const rings = ['#c8102e', '#f2f2f2', '#c8102e', '#1846c9'];
    rings.forEach((col, i) => {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(0, 0, r * (1 - i * 0.22), 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    });
    // stella a cinque punte che gira con lo scudo
    ctx.rotate(t / 400);
    ctx.fillStyle = '#ffffff';
    const R = r * 0.32, rr = R * 0.42;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const d = i % 2 ? rr : R;
      if (i === 0) ctx.moveTo(Math.cos(a) * d, Math.sin(a) * d); else ctx.lineTo(Math.cos(a) * d, Math.sin(a) * d);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // pallina thor: sfera di tempesta con il martello d'argento e fulmini azzurri
  let thorBolts = [];
  let ballBolts = [];
  // schermata YOU WIN: quando è comparsa, quanto dura la rotazione, fulmini della scritta
  let winStartedAt = null;
  const WIN_SPIN_MS = 3000;
  let winBolts = [];
  function drawThor(x, y, r, t) {
    if (Math.random() < 0.22) {
      const a = Math.random() * Math.PI * 2;
      const l = 25 + Math.random() * 40;
      const b = makeBolt(x, y, x + Math.cos(a) * l, y + Math.sin(a) * l, 4);
      b.color = '#d6f0ff';
      b.glow = '#3aa0ff';
      b.width = 1.8;
      thorBolts.push(b);
    }
    thorBolts = drawBolts(thorBolts);

    ctx.save();
    ctx.translate(x, y);
    ctx.shadowColor = '#3aa0ff';
    ctx.shadowBlur = 16;
    const g = ctx.createRadialGradient(-r / 3, -r / 3, 0, 0, 0, r);
    g.addColorStop(0, '#8fa3c0');
    g.addColorStop(0.6, '#3b4a66');
    g.addColorStop(1, '#151d30');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    // martello (Mjolnir) che ruota
    ctx.rotate(t / 300);
    ctx.fillStyle = '#7a4a24';
    ctx.fillRect(-r * 0.09, -r * 0.05, r * 0.18, r * 0.8);
    const hg = ctx.createLinearGradient(0, -r * 0.6, 0, -r * 0.05);
    hg.addColorStop(0, '#f0f4f8');
    hg.addColorStop(1, '#8a96a6');
    ctx.fillStyle = hg;
    ctx.fillRect(-r * 0.5, -r * 0.6, r * 1.0, r * 0.55);
    ctx.restore();
  }

  // pallina hulk: faccia verde arrabbiata con i capelli neri; trema come se stesse per spaccare tutto
  function drawHulk(x, y, r, t) {
    ctx.save();
    const shake = Math.sin(t / 30) * 0.8;
    ctx.translate(x + shake, y);
    ctx.shadowColor = '#5fd13a';
    ctx.shadowBlur = 14;
    const g = ctx.createRadialGradient(-r / 3, -r / 3, 0, 0, 0, r);
    g.addColorStop(0, '#8ef06a');
    g.addColorStop(0.6, '#4caf2a');
    g.addColorStop(1, '#1f5c12');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
    // capelli
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.moveTo(-r, -r * 0.35);
    for (let i = 0; i <= 6; i++) ctx.lineTo(-r + i * (r / 3), -r * (i % 2 ? 0.55 : 0.3));
    ctx.lineTo(r, -r); ctx.lineTo(-r, -r);
    ctx.closePath();
    ctx.fill();
    // sopracciglia arrabbiate
    ctx.strokeStyle = '#123d0a';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(-r * 0.6, -r * 0.2); ctx.lineTo(-r * 0.12, 0);
    ctx.moveTo(r * 0.6, -r * 0.2); ctx.lineTo(r * 0.12, 0);
    ctx.stroke();
    // occhi
    ctx.fillStyle = '#e8ffe0';
    ctx.fillRect(-r * 0.45, r * 0.02, r * 0.28, r * 0.16);
    ctx.fillRect(r * 0.17, r * 0.02, r * 0.28, r * 0.16);
    // bocca con i denti stretti
    ctx.fillStyle = '#123d0a';
    ctx.fillRect(-r * 0.4, r * 0.42, r * 0.8, r * 0.26);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-r * 0.34, r * 0.46, r * 0.68, r * 0.08);
    ctx.restore();
  }

  // texture per la scritta YOU WIN di Captain America: fascia blu con stelle e strisce rosse e bianche
  let captainTexture = null;
  function captainTextTexture() {
    if (captainTexture) return captainTexture;
    captainTexture = document.createElement('canvas');
    captainTexture.width = 480;
    captainTexture.height = 140;
    const c = captainTexture.getContext('2d');
    for (let y = 0; y < 140; y += 14) {
      c.fillStyle = (y / 14) % 2 ? '#ffffff' : '#c8102e';
      c.fillRect(0, y, 480, 14);
    }
    c.fillStyle = '#1846c9';
    c.fillRect(0, 0, 480, 66);
    c.fillStyle = '#ffffff';
    for (let y = 10; y < 62; y += 16) {
      for (let x = 12 + ((y / 16) % 2) * 14; x < 480; x += 28) {
        c.beginPath(); c.arc(x, y, 3, 0, Math.PI * 2); c.fill();
      }
    }
    return captainTexture;
  }

  let spiderTexture = null;
  function spiderTextTexture() {
    if (spiderTexture) return spiderTexture;
    spiderTexture = document.createElement('canvas');
    spiderTexture.width = 480;
    spiderTexture.height = 140;
    const s = spiderTexture.getContext('2d');
    s.fillStyle = '#d6001c';
    s.fillRect(0, 0, 480, 140);
    s.fillStyle = '#1846c9';
    s.fillRect(0, 96, 480, 44);
    s.strokeStyle = '#000';
    s.lineWidth = 1.6;
    drawWeb(s, 240, 74, 300, 9, 20);
