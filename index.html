<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="logo.png">
<title data-i18n="index.title">Sala Giochi</title>
<script src="i18n.js"></script>
<style>
  :root {
    --bg: #e2d2f4;
    --panel: #ffffff;
    --panel-2: #e2edff;
    --border: #bcd5f5;
    --text: #000000;
    --muted: #000000;
    --accent: #f7a3c7;
    --accent-2: #9fcaf2;
  }
  * { box-sizing: border-box; }
  button, input, select, kbd { font-family: inherit; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      linear-gradient(180deg, #1689F5 0%, #F58CA8 100%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 32px 16px 48px;
  }
  main { max-width: 960px; margin: 0 auto; }

  /* presentazione del sito: allineata a sinistra, senza riquadro,
     solo le scritte con un leggero alone neon bianco */
  .intro {
    max-width: 760px;
    margin: 0;
    padding: 8px 0 0;
    text-align: left;
    text-shadow: 0 0 4px rgba(255, 255, 255, .9), 0 0 10px rgba(255, 255, 255, .6), 0 0 18px rgba(255, 255, 255, .35);
  }
  .intro h1 { margin: 0; font-size: 1.9rem; line-height: 1.2; }
  .intro .tagline {
    margin: 8px 0 16px;
    font-size: 1.1rem; font-weight: 700;
  }
  .intro p { margin: 0 0 12px; font-size: 1rem; line-height: 1.55; }
  /* il motto, tra due linee arcobaleno i cui colori scorrono di continuo */
  .intro .motto {
    position: relative;
    margin: 18px 0 10px;
    padding: 12px 0;
    font-size: 1.12rem; font-weight: 700;
  }
  .intro .motto::before, .intro .motto::after {
    content: "";
    position: absolute; left: 0; right: 0;
    height: 3px;
    border-radius: 3px;
    background: linear-gradient(90deg, red, orange, yellow, lime, cyan, blue, violet, red);
    background-size: 200% 100%;
    box-shadow: 0 0 6px rgba(255, 255, 255, .7);
    animation: rainbow-flow 3s linear infinite;
  }
  .intro .motto::before { top: 0; }
  /* la linea sotto scorre nel verso opposto, così l'arcobaleno sembra girare intorno al motto */
  .intro .motto::after { bottom: 0; animation-direction: reverse; }
  @keyframes rainbow-flow {
    from { background-position: 0 0; }
    to   { background-position: -200% 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .intro .motto::before, .intro .motto::after { animation: none; }
  }
  .intro .cta { margin: 0; font-size: 1.05rem; font-weight: 600; }
  @media (max-width: 560px) {
    .intro h1 { font-size: 1.5rem; }
  }

  @keyframes slow-blink {
    0%, 100% {
      opacity: 1;
      text-shadow: 0 0 6px var(--glow, currentColor), 0 0 14px var(--glow, currentColor), 0 0 24px var(--glow, currentColor);
    }
    50% { opacity: .3; text-shadow: none; }
  }

  /* card in stile Netflix: copertine 16:9 in fila, al passaggio del mouse
     la card si ingrandisce e sotto si apre il pannello con i dettagli */
  .row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 28px;
    padding-bottom: 40px;
  }

  .card {
    position: relative;
    display: block;
    border-radius: 8px;
    color: inherit;
    text-decoration: none;
    transition: transform .25s ease, box-shadow .25s ease;
    transform-origin: center top;
  }
  .card .thumb {
    position: relative;
    aspect-ratio: 16 / 9;
    border-radius: 8px;
    overflow: hidden;
    background: var(--cover);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
  }
  .card .emoji {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-size: 3.4rem;
    padding-bottom: 30px;
  }
  /* titolo sopra la copertina, con una sfumatura chiara per leggerlo bene */
  .card .title {
    position: absolute; left: 0; right: 0; bottom: 0;
    margin: 0; padding: 22px 12px 8px;
    font-size: 1.35rem; font-weight: 700;
    background: linear-gradient(to top, rgba(255, 255, 255, .92), rgba(255, 255, 255, 0));
  }

  .card .info {
    display: flex; flex-direction: column; gap: 8px;
    padding: 12px 14px 14px;
    background: var(--panel);
    border-radius: 0 0 8px 8px;
    box-shadow: 0 10px 24px rgba(0, 0, 0, .3);
  }
  .card .info p { margin: 0; font-size: .85rem; line-height: 1.4; }

  @media (hover: hover) and (min-width: 701px) {
    .card .info {
      position: absolute; top: 100%; left: 0; right: 0;
      opacity: 0; visibility: hidden;
      transition: opacity .2s ease, visibility .2s;
    }
    .card:hover, .card:focus-visible { transform: scale(1.18); z-index: 5; outline: none; }
    .card:hover .thumb, .card:focus-visible .thumb { border-radius: 8px 8px 0 0; }
    .card:hover .info, .card:focus-visible .info { opacity: 1; visibility: visible; }
    /* le card ai bordi crescono verso l'interno, così non escono dalla pagina */
    .row .card:first-child { transform-origin: left top; }
    .row .card:last-child { transform-origin: right top; }
  }

  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag {
    font-size: .72rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--panel-2);
    color: var(--muted);
  }

  .play {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--card-color);
    color: var(--text);
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 6px;
    --glow: #fff;
  }
  .play span { animation: slow-blink 2.4s ease-in-out infinite; }

  /* schede dei giochi che arriveranno */
  .card.soon .thumb {
    background: repeating-linear-gradient(45deg, #fff0f6 0 14px, #eef6ff 14px 28px);
  }
  .card.soon .emoji { color: #e6c6dc; font-weight: 900; }
  .badge {
    position: absolute;
    top: 8px; right: 8px;
    font-size: .72rem;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    background: #bcd5f5;
    color: var(--text);
  }

  footer { text-align: center; color: #000000; font-size: .85rem; margin-top: 24px; }

  /* sul telefono: la fila scorre di lato con il dito e i dettagli sono sempre visibili */
  @media (max-width: 700px) {
    .row {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      margin: 20px -16px 0;
      padding: 0 16px 12px;
    }
    .card { flex: 0 0 78%; scroll-snap-align: start; }
  }
</style>
</head>
<body>
<main>
  <header class="intro">
    <h1 data-i18n="intro.title"></h1>
    <p class="tagline" data-i18n="intro.tagline"></p>
    <p data-i18n="intro.p1"></p>
    <p data-i18n-html="intro.p2"></p>
    <p data-i18n="intro.p3"></p>
    <p class="motto" data-i18n="intro.motto"></p>
    <p class="cta" data-i18n="intro.cta"></p>
  </header>

  <section class="row" id="games"></section>

  <footer data-i18n="index.footer">Nuovi giochi in arrivo!</footer>
</main>

<script>
  // Elenco dei giochi: per aggiungerne uno nuovo basta aggiungere un oggetto qui.
  // I testi sono chiavi di traduzione (vedi i18n.js). Se "file" è vuoto la scheda compare come "In arrivo".
  const GAMES = [
    {
      title: 'Ping Pong',
      emoji: '🏓',
      file: 'pingpong.html',
      description: 'game.pingpong.desc',
      tags: ['tag.2players', 'tag.keyboardTouch', 'tag.40min'],
      color: '#f7a3c7',
      cover: 'linear-gradient(135deg, #bfe0ff, #d9c8f5 50%, #ffc4de)',
    },
    {
      title: 'PixelCraft',
      emoji: '⛏️',
      file: 'pixelcraft.html',
      description: 'game.pixelcraft.desc',
      tags: ['tag.1player', 'tag.building', 'tag.mouseTouch'],
      color: '#5fa83a',
      cover: 'linear-gradient(180deg, #7ec8ff 0 48%, #5fa83a 48% 58%, #866043 58% 82%, #7d7d7d 82%)',
    },
    { number: 3, emoji: '?', file: '', tags: [] },
    { number: 4, emoji: '?', file: '', tags: [] },
  ];

  const row = document.getElementById('games');
  const t = (key, vars) => I18N.t(key, vars);

  function renderGames() {
    row.innerHTML = '';
    GAMES.forEach(game => {
      const available = Boolean(game.file);
      const card = document.createElement(available ? 'a' : 'div');
      card.className = 'card' + (available ? '' : ' soon');
      if (available) {
        card.href = game.file;
        card.style.setProperty('--card-color', game.color);
        card.style.setProperty('--cover', game.cover);
      } else {
        card.tabIndex = 0;
      }

      // copertina con emoji, titolo sopra l'immagine ed eventuale "In arrivo"
      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      const emoji = document.createElement('div');
      emoji.className = 'emoji';
      emoji.textContent = game.emoji;
      thumb.appendChild(emoji);
      if (!available) {
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = t('card.soon');
        thumb.appendChild(badge);
      }
      const title = document.createElement('h2');
      title.className = 'title';
      title.textContent = available ? game.title : t('card.soonTitle', { n: game.number });
      thumb.appendChild(title);
      card.appendChild(thumb);

      // pannello dei dettagli
      const info = document.createElement('div');
      info.className = 'info';

      if (available) {
        const play = document.createElement('span');
        play.className = 'play';
        const label = document.createElement('span');
        label.textContent = t('card.play');
        play.appendChild(label);
        info.appendChild(play);
      }

      if (game.tags.length) {
        const tags = document.createElement('div');
        tags.className = 'tags';
        game.tags.forEach(key => {
          const tag = document.createElement('span');
          tag.className = 'tag';
          tag.textContent = t(key);
          tags.appendChild(tag);
        });
        info.appendChild(tags);
      }

      const p = document.createElement('p');
      p.textContent = available ? t(game.description) : t('card.soonDesc');
      info.appendChild(p);

      card.appendChild(info);
      row.appendChild(card);
    });
  }

  renderGames();
  window.addEventListener('langchange', renderGames);
</script>
</body>
</html>
