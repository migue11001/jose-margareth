  }

  // pallina caramella: strisce rosa e bianche che ruotano, come un lecca-lecca
  function drawCandy(x, y, r, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = '#fff';
    ctx.fillRect(-r, -r, r * 2, r * 2);
    ctx.rotate(angle);
    ctx.fillStyle = '#ff3d7f';
    for (let i = -3; i <= 3; i += 2) ctx.fillRect(i * r / 3, -r * 1.5, r / 3, r * 3);
    ctx.restore();
  }

  // pallina lava: nucleo incandescente con croste scure che si muovono
  const LAVA_SPOTS = Array.from({ length: 5 }, () => ({
    a: Math.random() * Math.PI * 2,
    d: 0.4 + Math.random() * 0.5,
    s: 0.25 + Math.random() * 0.2,
    v: 0.5 + Math.random(),
  }));

  function drawLava(x, y, r, t) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
    const pulse = 0.15 + 0.1 * Math.sin(t / 120);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
    g.addColorStop(0, '#fff3a0');
    g.addColorStop(pulse + 0.2, '#ffcc00');
    g.addColorStop(0.65, '#ff5a00');
    g.addColorStop(1, '#b01200');
    ctx.fillStyle = g;
    ctx.fillRect(-r, -r, r * 2, r * 2);
    ctx.fillStyle = 'rgba(60, 8, 0, 0.75)';
    LAVA_SPOTS.forEach(sp => {
      const a = sp.a + t / 1000 * sp.v;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * sp.d * r, Math.sin(a) * sp.d * r, sp.s * r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  // pallina galassia: nebulosa viola/blu/rosa con stelline che brillano
  const GALAXY_STARS = Array.from({ length: 7 }, () => ({
    a: Math.random() * Math.PI * 2,
    d: Math.random() * 0.75,
    s: Math.random() * Math.PI * 2,
  }));

  function drawGalaxy(x, y, r, t) {
    const baseAlpha = ctx.globalAlpha;
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
    const g = ctx.createRadialGradient(-r / 3, -r / 3, 0, 0, 0, r);
    g.addColorStop(0, '#ff7ad9');
    g.addColorStop(0.35, '#9b3dff');
    g.addColorStop(0.75, '#2a2a9e');
    g.addColorStop(1, '#0b0628');
    ctx.fillStyle = g;
    ctx.fillRect(-r, -r, r * 2, r * 2);
    ctx.rotate(t / 1200);
    ctx.fillStyle = '#fff';
    GALAXY_STARS.forEach(st => {
      ctx.globalAlpha = baseAlpha * (0.5 + 0.5 * Math.sin(t / 150 + st.s));
      ctx.fillRect(Math.cos(st.a) * st.d * r, Math.sin(st.a) * st.d * r, 1.5, 1.5);
    });
    ctx.restore();
  }

  // simbolo yin yang che ruota
  function drawYinYang(x, y, r, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(0, 0, r, -Math.PI / 2, Math.PI / 2);
    ctx.arc(0, r / 2, r / 2, Math.PI / 2, -Math.PI / 2, true);
    ctx.arc(0, -r / 2, r / 2, Math.PI / 2, -Math.PI / 2);
    ctx.fill();
    ctx.beginPath(); ctx.arc(0, r / 2, r / 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, -r / 2, r / 6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // lo sfondo è tutto del colore della pallina scelta (i colori speciali usano una sfumatura dei loro colori)
  const BG_THEMES = {
    yinyang:   ['#ffffff', '#555555', '#ffffff'],
    galaxy:    ['#b05cff', '#ff4fa3', '#2f5bff'],
    candy:     ['#ff3d7f', '#ffffff', '#ff8fb8'],
    cursed:    ['#ff0000', '#7a0000', '#ff2020'],
    cyborg:    ['#00e5ff', '#1e5bff', '#5ff3ff'],
    lava:      ['#ff6a00', '#ff2a00', '#ffcc00'],
    water:     ['#2ba8ff', '#0a3f8f', '#9be6ff'],
    earth:     ['#4caf3a', '#8a5a2b', '#7a4a1f'],
    snow:      ['#bfe8ff', '#ffffff', '#8fcff5'],
    spiderman: ['#e0001f', '#1846c9', '#e0001f'],
    ironman:   ['#c8102e', '#f2c14e', '#c8102e'],
    captain:   ['#1846c9', '#1846c9', '#c8102e'],
    thor:      ['#1e2a44', '#5f7fa8', '#1e2a44'],
    hulk:      ['#2f8a1f', '#5fd13a', '#6a2c91'],
    diamond:   ['#2bc4e0', '#b9fbff', '#4ff0ff'],
    emerald:   ['#0b6e3c', '#11c26d', '#50e3a4'],
    amethyst:  ['#3c1a6b', '#9b5de5', '#e3c6ff'],
    netherite: ['#2a2426', '#4a4245', '#6b4f4a'],
    copper:    ['#b5532a', '#e07b4a', '#4fb8a0'],
    gold:      ['#b8860b', '#ffd84a', '#b8860b'],
    summer:    ['#3fa7d6', '#ffb703', '#ff7b00'],
    winter:    ['#1d3557', '#a8dadc', '#457b9d'],
    autumn:    ['#9c2c00', '#f77f00', '#6b3e26'],
    spring:    ['#7bc950', '#ff8fc8', '#a8e6a1'],
    sonic:     ['#1f5fd6', '#3fbf5f', '#4f8bff'],
    shadow:    ['#111111', '#7a0f0f', '#2a2a2a'],
  };
  const BG_FADE = 700; // ms per passare dai colori vecchi ai nuovi

  let bgShown = ballColor;
  let bgPrev = null;
  let bgChangedAt = 0;

  function bgColors(color, t) {
    if (color === 'rainbow') {
      const h = (t / 40) % 360;
      return [`hsl(${h}, 100%, 55%)`, `hsl(${h + 120}, 100%, 55%)`, `hsl(${h + 240}, 100%, 55%)`];
    }
    if (flagId(color)) return FLAGS[flagId(color)].colors;
    return BG_THEMES[color] || [color, color, color];
  }

  // riempie tutto il campo con i colori del tema (da sinistra a destra)
  function drawTint(color, t, alpha) {
    const cols = bgColors(color, t);
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, cols[0]);
    g.addColorStop(0.5, cols[1]);
    g.addColorStop(1, cols[2]);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  function drawBackground(t) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    if (ballColor !== bgShown) {
      bgPrev = bgShown;
      bgShown = ballColor;
      bgChangedAt = t;
    }
    const f = Math.min(1, (t - bgChangedAt) / BG_FADE);
    if (bgPrev && f < 1) drawTint(bgPrev, t, 1);
    drawTint(bgShown, t, f);

    // il colore viene scurito un po', così la pallina dello stesso colore e le scritte restano visibili
    // (con Cursed il campo si scurisce e si schiarisce insieme al lampeggio della pallina)
    const dark = ballColor === 'cursed' && !cursedOn() ? 0.7 : 0.5;
    ctx.fillStyle = `rgba(0, 0, 0, ${dark})`;
    ctx.fillRect(0, 0, W, H);
  }

  function draw() {
    drawBackground(performance.now());

    // linea centrale
    ctx.fillStyle = '#4a3a80';
    for (let y = 10; y < H; y += 30) ctx.fillRect(W / 2 - 2, y, 4, 16);

    // punteggi e timer: tempo al centro, punteggi ai lati
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 48px system-ui, sans-serif';
    ctx.fillStyle = '#fbeefe';
    textGlow('#fbeefe');
    ctx.fillText(p1.score, W / 2 - 110, 40);
    ctx.fillText(p2.score, W / 2 + 110, 40);
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.fillText(playerName(1), W / 2 - 110, 78);
    ctx.fillText(playerName(2), W / 2 + 110, 78);
    textGlowOff();
    ctx.fillStyle = '#000';
    ctx.fillRect(W / 2 - 52, 20, 104, 40);
    ctx.strokeStyle = '#4a3a80';
    ctx.lineWidth = 2;
    ctx.strokeRect(W / 2 - 52, 20, 104, 40);
    ctx.font = 'bold 26px ui-monospace, Menlo, monospace';
    const timerColor = Math.ceil(timeLeft) <= 30 ? '#ff5b5b' : '#fbeefe';
    ctx.fillStyle = timerColor;
    textGlow(timerColor);
    ctx.fillText(formatTime(), W / 2, 41);
    textGlowOff();
    ctx.textBaseline = 'alphabetic';

    // racchette
    ctx.fillStyle = '#fbeefe';
    ctx.fillRect(p1.x, p1.y, PADDLE_W, PADDLE_H);
    ctx.fillRect(p2.x, p2.y, PADDLE_W, PADDLE_H);

    // scia
    trail.forEach((t, i) => {
      ctx.globalAlpha = (i / trail.length) * 0.35;
      ctx.fillStyle = currentColor(t.hue);
      ctx.beginPath();
      ctx.arc(t.x, t.y, BALL_R * (i / trail.length), 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    // particelle delle stagioni
    drawSeasonParticles();

    // piccoli fulmini intorno alla pallina, del colore della pallina
    // (Cursed e Thor hanno già i loro fulmini, neri e azzurri)
    if (ballColor !== 'cursed' && ballColor !== 'thor') {
      if (Math.random() < 0.18) {
        const a = Math.random() * Math.PI * 2;
        const len = 16 + Math.random() * 20;
        const sx = ball.x + Math.cos(a) * BALL_R, sy = ball.y + Math.sin(a) * BALL_R;
        const bolt = makeBolt(sx, sy, sx + Math.cos(a) * len, sy + Math.sin(a) * len, 4);
        const col = currentColor(hue);
        bolt.color = col;
        bolt.glow = col;
        bolt.width = 1.6;
        bolt.branches = [];
        ballBolts.push(bolt);
      }
    }
    ballBolts = drawBolts(ballBolts);

    // pallina
    const col = currentColor(hue);
    ctx.save();
    ctx.shadowColor = col;
    ctx.shadowBlur = 18;
    if (ballColor === 'yinyang') {
      drawYinYang(ball.x, ball.y, BALL_R, performance.now() / 150);
    } else if (ballColor === 'galaxy') {
      drawGalaxy(ball.x, ball.y, BALL_R, performance.now());
    } else if (ballColor === 'cursed') {
      drawCursed(ball.x, ball.y, BALL_R);
    } else if (ballColor === 'cyborg') {
      drawCyborg(ball.x, ball.y, BALL_R, performance.now());
    } else if (ballColor === 'spiderman') {
      drawSpider(ball.x, ball.y, BALL_R);
    } else if (ballColor === 'ironman') {
      drawIronMan(ball.x, ball.y, BALL_R, performance.now());
    } else if (ballColor === 'captain') {
      drawCaptain(ball.x, ball.y, BALL_R, performance.now());
    } else if (ballColor === 'thor') {
      drawThor(ball.x, ball.y, BALL_R, performance.now());
    } else if (ballColor === 'hulk') {
      drawHulk(ball.x, ball.y, BALL_R, performance.now());
    } else if (GEMS[ballColor]) {
      drawGem(ball.x, ball.y, BALL_R, performance.now(), ballColor);
    } else if (METALS[ballColor]) {
      drawMetal(ball.x, ball.y, BALL_R, performance.now(), ballColor);
    } else if (flagId(ballColor)) {
      drawFlagBall(ball.x, ball.y, BALL_R, performance.now(), flagId(ballColor));
    } else if (ballColor === 'sonic' || ballColor === 'shadow') {
      drawHedgehog(ball.x, ball.y, BALL_R, performance.now(), ballColor);
    } else if (ballColor === 'summer') {
      drawSummer(ball.x, ball.y, BALL_R, performance.now());
    } else if (ballColor === 'winter') {
      drawWinter(ball.x, ball.y, BALL_R, performance.now());
    } else if (ballColor === 'autumn') {
      drawAutumn(ball.x, ball.y, BALL_R, performance.now());
    } else if (ballColor === 'spring') {
      drawSpring(ball.x, ball.y, BALL_R, performance.now());
    } else if (ballColor === 'candy') {
      drawCandy(ball.x, ball.y, BALL_R, performance.now() / 200);
    } else if (ballColor === 'lava') {
      drawLava(ball.x, ball.y, BALL_R, performance.now());
    } else if (ballColor === 'water') {
      drawWater(ball.x, ball.y, BALL_R, performance.now());
    } else if (ballColor === 'earth') {
      drawEarth(ball.x, ball.y, BALL_R, performance.now() / 300);
    } else if (ballColor === 'snow') {
      drawSnow(ball.x, ball.y, BALL_R, performance.now() / 400);
    } else {
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    // avviso del tiro super veloce
    const msgLeft = superMsgUntil - performance.now();
    if (running && msgLeft > 0) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '900 38px Impact, "Arial Black", system-ui, sans-serif';
      ctx.globalAlpha = Math.min(1, msgLeft / 300);
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#000';
      ctx.strokeText(I18N.t('pp.superFast'), W / 2, H - 40);
      ctx.fillStyle = '#ffe14b';
      ctx.shadowColor = '#ffe14b';
      ctx.shadowBlur = 20;
      ctx.fillText(I18N.t('pp.superFast'), W / 2, H - 40);
      ctx.restore();
    }

    // messaggi
    ctx.textAlign = 'center';
    if (winner === 'pareggio') {
      overlay(I18N.t('pp.draw'), I18N.t('pp.pressReset'));
    } else if (winner) {
      drawWin();
    } else if (!running) {
      overlay(I18N.t('pp.paused'), I18N.t('pp.pressPlay'), helpLines());
    }
  }

  // i comandi del gioco (testo di pp.help senza i tag HTML), una riga per ogni voce
  function helpLines() {
    return I18N.t('pp.help')
      .replace(/<\/?(kbd|b)>/g, '')
      .replace(/&nbsp;/g, ' ')
      .split(/<br>|·/)
      .map(s => s.trim())
      .filter(Boolean);
  }

  function overlay(title, subtitle, lines = []) {
    const LINE = 24;
    // con i comandi sotto, titolo e sottotitolo salgono per lasciare spazio
    const top = H / 2 - 10 - (lines.length * LINE) / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    textGlow('#fff');
    ctx.font = 'bold 40px system-ui, sans-serif';
    ctx.fillText(title, W / 2, top);
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillStyle = '#b9c0e6';
    textGlow('#b9c0e6');
    ctx.fillText(subtitle, W / 2, top + 38);
    ctx.font = '15px system-ui, sans-serif';
    ctx.fillStyle = '#dfe3f7';
    lines.forEach((line, i) => ctx.fillText(line, W / 2, top + 84 + i * LINE));
    textGlowOff();
  }

  // Coriandoli
  // i coriandoli prendono i colori della pallina scelta (gli stessi del tema dello sfondo),
  // con qualche sfumatura più chiara e più scura
  const confetti = [];
  const confettiPalettes = {};

  function shade(hex, amount) {
    // amount > 0 schiarisce verso il bianco, < 0 scurisce verso il nero
    const n = parseInt(hex.slice(1), 16);
    const mix = (c) => Math.round(amount > 0 ? c + (255 - c) * amount : c * (1 + amount));
    const r = mix(n >> 16), g = mix((n >> 8) & 255), b = mix(n & 255);
    return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
  }

  function confettiPalette(color) {
    if (confettiPalettes[color]) return confettiPalettes[color];
    const base = [...new Set(bgColors(color, 0))];
    const palette = [];
    base.forEach(c => {
      palette.push(c);
      if (/^#[0-9a-f]{6}$/i.test(c)) palette.push(shade(c, 0.45), shade(c, -0.25));
    });
    confettiPalettes[color] = palette;
    return palette;
  }

  function confettoColor(c) {
    // con Arcobaleno ogni coriandolo cambia colore di continuo
    if (ballColor === 'rainbow') return `hsl(${(c.pick * 360 + hue) % 360}, 100%, 60%)`;
    const palette = confettiPalette(ballColor);
    return palette[Math.floor(c.pick * palette.length)];
  }

  function makeConfetto(startAbove) {
    return {
      x: Math.random() * W,
      y: startAbove ? -Math.random() * H : -10,
      w: 6 + Math.random() * 6,
      h: 10 + Math.random() * 8,
      vy: 1.5 + Math.random() * 2.5,
      vx: Math.random() * 1.6 - 0.8,
      rot: Math.random() * Math.PI * 2,
      vrot: Math.random() * 0.2 - 0.1,
      sway: Math.random() * Math.PI * 2,
      pick: Math.random(),
    };
  }

  function drawConfetti() {
    if (confetti.length === 0) {
      for (let i = 0; i < 160; i++) confetti.push(makeConfetto(true));
    }
    confetti.forEach((c, i) => {
      c.sway += 0.05;
      c.x += c.vx + Math.sin(c.sway) * 0.8;
      c.y += c.vy;
      c.rot += c.vrot;
      if (c.y > H + 20) confetti[i] = makeConfetto(false);

      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rot);
      // l'altezza oscilla per simulare il coriandolo che gira su se stesso
      ctx.fillStyle = confettoColor(c);
      ctx.fillRect(-c.w / 2, -c.h / 2 * Math.abs(Math.cos(c.sway)), c.w, c.h * Math.abs(Math.cos(c.sway)));
      ctx.restore();
    });
  }

  function drawWin() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    drawConfetti();
    ctx.textAlign = 'center';

    // "YOU WIN" del colore della pallina, con bordo giallo, leggermente pulsante.
    // Per i primi 3 secondi gira su sé stessa (3 giri che rallentano), poi resta ferma e spara fulmini.
    const now = performance.now();
    if (winStartedAt === null) winStartedAt = now;
    const spinT = Math.min(1, (now - winStartedAt) / WIN_SPIN_MS);
    const spinAngle = Math.PI * 6 * Math.pow(1 - spinT, 3);
    const scale = 1 + Math.sin(now / 200) * 0.05;
    ctx.save();
    // la scritta gira intorno al suo centro (36 px sopra la linea di base del testo)
    ctx.translate(W / 2, H / 2 - 56);
    ctx.rotate(spinAngle);
    ctx.translate(0, 36);
    if (ballColor === 'hulk') ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 6);
    ctx.scale(scale, scale);
    ctx.font = '900 96px Impact, "Arial Black", system-ui, sans-serif';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 10;
    // bordo giallo, ma rosso se la pallina è gialla (altrimenti la scritta non si leggerebbe)
    const border = ballColor === '#ffe14b' ? '#ff1e1e' : '#ffd60a';
    ctx.strokeStyle = border;
    ctx.shadowColor = border;
    ctx.shadowBlur = 20;
    ctx.strokeText('YOU WIN', 0, 0);
    ctx.shadowBlur = 0;
    if (ballColor === 'yinyang') {
      // metà bianca e metà nera
      const g = ctx.createLinearGradient(-220, 0, 220, 0);
      g.addColorStop(0, '#fff'); g.addColorStop(0.5, '#fff');
      g.addColorStop(0.5, '#111'); g.addColorStop(1, '#111');
      ctx.fillStyle = g;
    } else if (ballColor === 'galaxy') {
      // sfumatura spaziale rosa → viola → blu
      const g = ctx.createLinearGradient(-220, -40, 220, 40);
      g.addColorStop(0, '#ff4fa3');
      g.addColorStop(0.45, '#9b3dff');
      g.addColorStop(1, '#2f5bff');
      ctx.fillStyle = g;
    } else if (ballColor === 'cyborg') {
      // blu metallico con una banda azzurra luminosa che lampeggia
      const on = cyborgOn();
      const g = ctx.createLinearGradient(0, -50, 0, 40);
      g.addColorStop(0, '#4f8dff');
      g.addColorStop(0.42, '#0b3bc0');
      g.addColorStop(0.42, on ? '#5ff3ff' : '#1a6fa0');
      g.addColorStop(0.52, on ? '#5ff3ff' : '#1a6fa0');
      g.addColorStop(0.52, '#0b3bc0');
      g.addColorStop(1, '#04164f');
      ctx.fillStyle = g;
    } else if (ballColor === 'spiderman') {
      // rosso con la ragnatela nera, blu nella parte bassa
      const pat = ctx.createPattern(spiderTextTexture(), 'no-repeat');
      pat.setTransform(new DOMMatrix().translate(-240, -110));
      ctx.fillStyle = pat;
    } else if (ballColor === 'captain') {
      // bandiera: fascia blu con le stelle e strisce rosse e bianche
      const pat = ctx.createPattern(captainTextTexture(), 'no-repeat');
      pat.setTransform(new DOMMatrix().translate(-240, -110));
      ctx.fillStyle = pat;
    } else if (ballColor === 'thor') {
      // argento del martello con un lampo azzurro che lo attraversa
      const flash = Math.random() < 0.08;
      const g = ctx.createLinearGradient(0, -80, 0, 10);
      g.addColorStop(0, flash ? '#ffffff' : '#f0f4f8');
      g.addColorStop(0.5, flash ? '#bfe8ff' : '#9aa8ba');
      g.addColorStop(1, flash ? '#7ec8ff' : '#5a6678');
      ctx.fillStyle = g;
    } else if (ballColor === 'hulk') {
      // verde con i pantaloncini viola in basso
      const g = ctx.createLinearGradient(0, -80, 0, 10);
      g.addColorStop(0, '#8ef06a');
      g.addColorStop(0.62, '#3f9a22');
      g.addColorStop(0.62, '#6a2c91');
      g.addColorStop(1, '#4a1d68');
      ctx.fillStyle = g;
    } else if (ballColor === 'ironman') {
      // rosso metallico con una fascia dorata e un riflesso che scorre
      const shine = ((performance.now() / 1500) % 1) * 1.4 - 0.2;
      const g = ctx.createLinearGradient(-220, -60, 220, 20);
      g.addColorStop(0, '#8a0a10');
      g.addColorStop(clamp(shine - 0.08, 0, 1), '#c8102e');
      g.addColorStop(clamp(shine, 0, 1), '#ffd98a');
      g.addColorStop(clamp(shine + 0.08, 0, 1), '#c8102e');
      g.addColorStop(1, '#8a0a10');
      ctx.fillStyle = g;
    } else if (ballColor === 'sonic' || ballColor === 'shadow') {
      // Sonic: blu con un riflesso che sfreccia; Shadow: nero con la fascia rossa degli aculei
      const g = ctx.createLinearGradient(0, -80, 0, 10);
      if (ballColor === 'sonic') {
        g.addColorStop(0, '#9cc7ff');
        g.addColorStop(0.5, '#1f5fd6');
        g.addColorStop(1, '#0b2d7a');
      } else {
        g.addColorStop(0, '#4a4a4a');
        g.addColorStop(0.42, '#111111');
        g.addColorStop(0.42, '#e63946');
        g.addColorStop(0.62, '#e63946');
        g.addColorStop(0.62, '#111111');
        g.addColorStop(1, '#000000');
      }
      ctx.fillStyle = g;
    } else if (['summer', 'winter', 'autumn', 'spring'].includes(ballColor)) {
      // sfumatura della stagione, dall'alto in basso
      const STOPS = {
        summer: ['#fff3b0', '#ffd60a', '#ff9e00', '#ff4f8b'],
        winter: ['#ffffff', '#e6f6ff', '#a8dadc', '#4a90d9'],
        autumn: ['#ffd166', '#f77f00', '#c1121f', '#6b1a0c'],
        spring: ['#ffd6ea', '#ff8fc8', '#7bc950', '#3a8a2a'],
      }[ballColor];
      const g = ctx.createLinearGradient(0, -80, 0, 10);
      STOPS.forEach((c, i) => g.addColorStop(i / (STOPS.length - 1), c));
      ctx.fillStyle = g;
    } else if (flagId(ballColor)) {
      // la bandiera dentro le lettere
      const pat = ctx.createPattern(flagTex(flagId(ballColor), 480, 140), 'no-repeat');
      pat.setTransform(new DOMMatrix().translate(-240, -110));
      ctx.fillStyle = pat;
    } else if (GEMS[ballColor] || METALS[ballColor]) {
      // colori della gemma o del metallo con un riflesso bianco che li attraversa
      const c = GEMS[ballColor] || METALS[ballColor];
      const shine = ((performance.now() / 1300) % 1) * 1.4 - 0.2;
      const g = ctx.createLinearGradient(-220, -60, 220, 20);
      g.addColorStop(0, c.dark);
      g.addColorStop(clamp(shine - 0.1, 0, 1), c.mid);
      g.addColorStop(clamp(shine, 0, 1), '#ffffff');
      g.addColorStop(clamp(shine + 0.1, 0, 1), c.mid);
      g.addColorStop(1, c.light);
      ctx.fillStyle = g;
    } else if (ballColor === 'candy') {
      // strisce diagonali rosa e bianche
      const p = document.createElement('canvas');
      p.width = p.height = 24;
      const pc = p.getContext('2d');
      pc.fillStyle = '#fff'; pc.fillRect(0, 0, 24, 24);
      pc.fillStyle = '#ff3d7f';
      pc.beginPath();
      pc.moveTo(0, 0); pc.lineTo(12, 0); pc.lineTo(0, 12); pc.closePath();
      pc.moveTo(24, 0); pc.lineTo(24, 12); pc.lineTo(12, 24); pc.lineTo(0, 24); pc.closePath();
      pc.fill();
      ctx.fillStyle = ctx.createPattern(p, 'repeat');
    } else if (ballColor === 'lava') {
      // dal giallo incandescente in alto al rosso scuro in basso
      const g = ctx.createLinearGradient(0, -50, 0, 40);
      g.addColorStop(0, '#ffe14b');
      g.addColorStop(0.45, '#ff6a00');
      g.addColorStop(1, '#c41000');
      ctx.fillStyle = g;
    } else if (ballColor === 'water') {
      // azzurro chiaro in alto, blu profondo in basso
      const g = ctx.createLinearGradient(0, -50, 0, 40);
      g.addColorStop(0, '#9be6ff');
      g.addColorStop(0.5, '#2ba8ff');
      g.addColorStop(1, '#0a3f8f');
      ctx.fillStyle = g;
    } else if (ballColor === 'earth') {
      // erba verde in alto, terra marrone sotto
      const g = ctx.createLinearGradient(0, -50, 0, 40);
      g.addColorStop(0, '#4caf3a');
      g.addColorStop(0.3, '#4caf3a');
      g.addColorStop(0.3, '#a87440');
      g.addColorStop(1, '#5e3a1a');
      ctx.fillStyle = g;
    } else if (ballColor === 'snow') {
      // bianco neve che sfuma in azzurro ghiaccio
      const g = ctx.createLinearGradient(0, -50, 0, 40);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(1, '#8fcff5');
      ctx.fillStyle = g;
    } else {
      ctx.fillStyle = currentColor(hue);
    }
    // il riempimento lampeggia e si illumina del colore della pallina; il bordo giallo resta acceso
    textGlow(currentColor(hue));
    ctx.fillText('YOU WIN', 0, 0);
    ctx.restore();

    // Maledetto: grossi fulmini neri che cadono dall'alto sulla scritta
    if (ballColor === 'cursed') {
      if (Math.random() < 0.12) {
        const x1 = 80 + Math.random() * (W - 160);
        const x2 = W / 2 + (Math.random() - 0.5) * 360;
        cursedBolts.push(makeBolt(x1, 0, x2, H / 2 - 40 + Math.random() * 40, 8));
      }
      cursedBolts = drawBolts(cursedBolts);
    }

    // finita la rotazione, la scritta spara fulmini del colore della pallina in tutte le direzioni
    if (spinT >= 1) {
      if (Math.random() < 0.45) {
        const sx = W / 2 + (Math.random() - 0.5) * 400;
        const sy = H / 2 - 56 + (Math.random() - 0.5) * 70;
        const a = Math.atan2(sy - (H / 2 - 56), sx - W / 2) + (Math.random() - 0.5) * 0.8;
        const len = 70 + Math.random() * 110;
        const b = makeBolt(sx, sy, sx + Math.cos(a) * len, sy + Math.sin(a) * len, 7);
        const col = currentColor(hue);
        b.color = col;
        b.glow = col;
        b.width = 2.5;
        winBolts.push(b);
      }
    }
    winBolts = drawBolts(winBolts);

    // Thor: fulmini azzurri e bianchi che cadono dall'alto sulla scritta
    if (ballColor === 'thor') {
      if (Math.random() < 0.15) {
        const x1 = 80 + Math.random() * (W - 160);
        const x2 = W / 2 + (Math.random() - 0.5) * 360;
        const b = makeBolt(x1, 0, x2, H / 2 - 40 + Math.random() * 40, 7);
        b.color = '#e6f6ff';
        b.glow = '#3aa0ff';
        thorBolts.push(b);
      }
      thorBolts = drawBolts(thorBolts);
    }

    ctx.font = 'bold 24px system-ui, sans-serif';
    ctx.fillStyle = '#fff';
    textGlow('#fff');
    ctx.fillText(winner, W / 2, H / 2 + 50);
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillStyle = '#b9c0e6';
    textGlow('#b9c0e6');
    ctx.fillText(I18N.t('pp.pressReset'), W / 2, H / 2 + 85);
    textGlowOff();
  }

  function loop(now) {
    hue = (hue + 4) % 360;
    updateUltra(now);
    const dt = lastTime === null ? 0 : (now - lastTime) / 1000;
    lastTime = now;
    if (running) {
      timeLeft = Math.max(0, timeLeft - Math.min(dt, 0.1));
      if (timeLeft === 0) timeUp();
      else {
        // se un fotogramma arriva in ritardo, il movimento viene diviso in piccoli passi
        // così la pallina non attraversa le racchette
        const k = Math.min(dt * 60, 4);
        const steps = Math.max(1, Math.ceil(k));
        for (let i = 0; i < steps && running; i++) update(k / steps);
      }
    }
    draw();
    requestAnimationFrame(loop);
  }

  // la musica suona solo mentre si gioca: si ferma in pausa e a fine partita
  const music = document.getElementById('music');
  music.volume = 0.6;
  function syncMusic() {
    if (running && !winner) music.play().catch(() => {});
    else music.pause();
  }

  function togglePause() {
    if (winner) return;
    running = !running;
    syncMusic();
  }

  // Tastiera
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    const k = e.key.toLowerCase();
    if (['arrowup', 'arrowdown', ' '].includes(k)) e.preventDefault();
    if (k === ' ') { togglePause(); return; }
    keys[k] = true;
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  // Touch: metà sinistra = giocatore 1, metà destra = giocatore 2
  function handleTouches(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    for (const t of e.touches) {
      const x = (t.clientX - rect.left) * (W / rect.width);
      const y = (t.clientY - rect.top) * (H / rect.height);
      const target = x < W / 2 ? p1 : p2;
      target.y = clamp(y - PADDLE_H / 2, 0, H - PADDLE_H);
    }
  }
  canvas.addEventListener('touchstart', handleTouches, { passive: false });
  canvas.addEventListener('touchmove', handleTouches, { passive: false });

  document.getElementById('startBtn').addEventListener('click', e => { togglePause(); e.target.blur(); });
  document.getElementById('resetBtn').addEventListener('click', e => {
    resetGame();
    running = true;
    music.currentTime = 0;
    syncMusic();
    e.target.blur();
  });

  resetGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
